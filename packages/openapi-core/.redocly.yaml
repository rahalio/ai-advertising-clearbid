apis:
  identity:
    root: src/identity.yaml
  campaigns:
    root: src/campaigns.yaml
  inventory:
    root: src/inventory.yaml
  bidding:
    root: src/bidding.yaml
  conversions:
    root: src/conversions.yaml
  settlement:
    root: src/settlement.yaml
  disputes:
    root: src/disputes.yaml
  reporting:
    root: src/reporting.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
