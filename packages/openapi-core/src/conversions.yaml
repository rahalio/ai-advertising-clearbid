openapi: 3.1.0
info:
  title: Conversions API
  version: 0.1.0
  description: |
    Attribution-token redemption and append-only conversion ledger.
    Both counterparties can verify proofs; neither can unilaterally rewrite settled records (BR-1, BR-12).
  x-domain: cnv
  x-product-slug: ubex-whitepaper-en
servers:
  - url: https://api.clearbid.local
security:
  - apiKey: []
tags:
  - name: Conversions
    description: Attribution tokens and attested conversion records
paths:
  /v1/conversions:
    get:
      operationId: listConversions
      tags: [Conversions]
      summary: List conversion records
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./conversions.schemas.yaml#/components/schemas/ConversionStatus
        - name: campaignId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Conversions page
          content:
            application/json:
              schema:
                $ref: ./conversions.schemas.yaml#/components/schemas/ConversionListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: attestConversion
      tags: [Conversions]
      summary: Attest a conversion against a signed attribution token
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./conversions.schemas.yaml#/components/schemas/ConversionAttestation
      responses:
        '201':
          description: Conversion attested on the ledger
          content:
            application/json:
              schema:
                $ref: ./conversions.schemas.yaml#/components/schemas/ConversionRecordResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/conversions/{conversionId}/verification:
    parameters:
      - name: conversionId
        in: path
        required: true
        schema:
          $ref: ./conversions.schemas.yaml#/components/schemas/ConversionId
    get:
      operationId: getConversionVerification
      tags: [Conversions]
      summary: Get hash-chained ledger proof for a conversion
      x-repository: none
      responses:
        '200':
          description: Ledger proof
          content:
            application/json:
              schema:
                $ref: ./conversions.schemas.yaml#/components/schemas/LedgerProofResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
