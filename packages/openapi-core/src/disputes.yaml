openapi: 3.1.0
info:
  title: Disputes API
  version: 0.1.0
  description: |
    Time-boxed dispute adjudication. Unresolved disputes default to recorded
    ledger evidence in favour of the conversion record (BR-4).
  x-domain: dsp
  x-product-slug: ubex-whitepaper-en
servers:
  - url: https://api.clearbid.local
security:
  - apiKey: []
tags:
  - name: Disputes
    description: Time-boxed dispute adjudication
paths:
  /v1/disputes:
    get:
      operationId: listDisputes
      tags: [Disputes]
      summary: List disputes
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./disputes.schemas.yaml#/components/schemas/DisputeStatus
      responses:
        '200':
          description: Disputes page
          content:
            application/json:
              schema:
                $ref: ./disputes.schemas.yaml#/components/schemas/DisputeListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: openDispute
      tags: [Disputes]
      summary: Open a dispute against a conversion record
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./disputes.schemas.yaml#/components/schemas/DisputeCreate
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: ./disputes.schemas.yaml#/components/schemas/DisputeResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/disputes/{disputeId}/resolution:
    parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          $ref: ./disputes.schemas.yaml#/components/schemas/DisputeId
    post:
      operationId: resolveDispute
      tags: [Disputes]
      summary: Resolve a dispute within the time-box
      x-repository: none
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./disputes.schemas.yaml#/components/schemas/DisputeResolution
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: ./disputes.schemas.yaml#/components/schemas/DisputeResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
